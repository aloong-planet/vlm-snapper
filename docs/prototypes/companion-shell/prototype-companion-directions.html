<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VLMSnapper · 菜单栏第一入口</title>
  <link rel="stylesheet" href="../_shared/vlmsnapper-shell.css">
  <!-- Demo harness: theme control is not product UI. -->
  <style>
    .workspace { position: relative; width: 100%; height: 100%; padding: 42px 48px 80px; }
    .desktop-context {
      width: min(980px, 77vw);
      height: min(570px, calc(100vh - 190px));
      margin: auto;
      display: grid;
      grid-template-rows: 48px 1fr;
      opacity: .62;
    }
    .context-titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .context-body { display: grid; grid-template-columns: 42% 58%; min-height: 0; padding: 16px; gap: 14px; background: var(--surface-subtle); }
    .context-card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .context-image { display: grid; place-items: center; padding: 24px; }
    .paper { width: 84%; aspect-ratio: 1.4; padding: 24px; border: 1px solid var(--line); border-radius: 4px; color: var(--paper-ink); background: var(--paper); }
    .paper strong { display: block; margin-bottom: 12px; font-family: Georgia, serif; font-size: 18px; }
    .paper span { display: block; width: 90%; height: 6px; margin: 7px 0; border-radius: 4px; background: var(--paper-line); }
    .paper span:nth-child(3) { width: 77%; }
    .context-result { padding: 18px; }
    .context-result h3 { margin: 0 0 12px; font-size: 13px; }
    .context-result p { margin: 0; color: var(--text-secondary); line-height: 1.6; }

    .menu-anchor {
      position: absolute;
      top: -26px;
      right: 20px;
      width: 28px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--accent-text);
      background: var(--surface-selected);
    }
    .capture-mark { width: 15px; height: 13px; border: 1.8px solid currentColor; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--menubar); }
    .popover {
      position: absolute;
      top: 4px;
      right: 10px;
      width: 370px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      background: var(--window);
      box-shadow: 0 18px 55px var(--shadow), 0 3px 12px var(--shadow-soft);
      backdrop-filter: blur(28px);
    }
    .popover-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 10px; }
    .popover-head strong { font-size: 15px; }
    .quick-action { margin: 0 10px 10px; }
    .quick-action .primary-button { width: 100%; height: 36px; }
    .shortcut { margin-left: auto; color: var(--on-accent); opacity: .76; font-size: 10px; font-weight: 500; }
    .recent-title { padding: 10px 14px 6px; color: var(--text-tertiary); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .recent-list { padding: 0 6px 6px; }
    .recent-item { display: grid; grid-template-columns: 58px 1fr auto; gap: 9px; align-items: center; padding: 8px; border-radius: 8px; }
    .recent-item:hover { background: var(--surface-hover); }
    .recent-item .thumb { height: 42px; }
    .recent-item strong { display: block; max-width: 196px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .recent-item p { margin: 4px 0 0; color: var(--text-secondary); font-size: 10px; }
    .popover-footer { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
    .popover-footer button { height: 40px; border: 0; background: transparent; color: var(--text-secondary); }
    .popover-footer button + button { border-left: 1px solid var(--line); }
    .popover-footer button:hover { color: var(--text); background: var(--surface-hover); }
  </style>
</head>
<body data-shared-block="vlmsnapper-shell">
  <main class="desktop">
    <header class="mac-menubar" aria-label="macOS menu bar mock">
      <div class="menubar-group"><strong>VLMSnapper</strong><span class="menubar-muted">文件</span><span class="menubar-muted">编辑</span></div>
      <div class="menubar-group"><span class="menubar-muted">8月25日 周二</span><span>14:30</span></div>
    </header>
    <div class="workspace">
      <article class="window desktop-context" aria-label="后台结果窗口示意">
        <header class="context-titlebar"><div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div><strong>截图结果</strong><div></div></header>
        <div class="context-body"><section class="context-card context-image"><div class="paper"><strong>Designing Calm Software</strong><span></span><span></span><span></span></div></section><section class="context-card context-result"><h3>译文</h3><p>优秀的工具软件始终贴近任务本身。它减少不必要的步骤，保留上下文，并让下一步操作清晰可见。</p></section></div>
      </article>
      <div class="menu-anchor" aria-hidden="true"><span class="capture-mark"></span></div>
      <aside class="popover" aria-label="VLMSnapper 菜单栏面板">
        <header class="popover-head"><strong>VLMSnapper</strong><span class="badge">DeepSeek 可用</span></header>
        <div class="quick-action"><button class="primary-button">截取屏幕 <span class="shortcut">⌥⇧S</span></button></div>
        <div class="recent-title">最近截图</div>
        <div class="recent-list">
          <div class="recent-item"><div class="thumb">Calm<br>Software</div><div><strong>Designing Calm Software</strong><p>翻译 · 2 分钟前</p></div><span class="badge">完成</span></div>
          <div class="recent-item"><div class="thumb">API<br>Guide</div><div><strong>Vision API integration guide</strong><p>提取文字 · 18 分钟前</p></div><span class="badge">完成</span></div>
          <div class="recent-item"><div class="thumb">429</div><div><strong>Provider request failed</strong><p>翻译 · 1 小时前</p></div><span class="badge error">失败</span></div>
        </div>
        <footer class="popover-footer">
          <button data-goto="management-center/history" data-goto-href="../management-center/prototype-management-center.html#history">查看全部历史</button>
          <button data-goto="management-center/settings" data-goto-href="../management-center/prototype-management-center.html#settings">设置中心</button>
        </footer>
      </aside>
    </div>
  </main>
  <div class="harness" data-demo-harness aria-label="演示控制，非产品界面"><span class="harness-label">演示·外观</span><button id="theme-control">切换深浅色</button></div>
  <script>
    document.querySelector('#theme-control').addEventListener('click', () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    });
    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-goto]');
      if (!target) return;
      if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: target.dataset.goto }, '*');
      else if (target.dataset.gotoHref) location.href = target.dataset.gotoHref;
    });
  </script>
</body>
</html>
