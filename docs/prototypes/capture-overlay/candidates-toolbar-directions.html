  <!--
    Candidates for the Save button icon of the attached capture toolbar (prototype-toolbar-directions.html,
    shared toolbar block). Each cell shows the whole toolbar with the candidate between Copy and Close,
    light and dark side by side. Glyphs are the app's SF Symbols rendered by AppKit at 15 pt (the toolbar's
    icon size) and used as masks. The recommended candidate is what the prototype pages show until chosen.
  -->

    * { box-sizing: border-box; }
    body { margin: 0; }
    .candidates { min-width: 1460px; min-height: 100vh; padding: 28px; color: #20242a; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; }
    .candidates h1 { margin: 0 0 18px; font-size: 18px; }
    .cell { margin-bottom: 18px; padding: 14px 16px; border: 1px solid #d9dde3; border-radius: 10px; background: #ffffff; }

<body>
  <main class="candidates">
    <h1>保存按钮图标候选（复制、关闭为现有图标）</h1>
      <section class="cell cand-0">
        <h2>square.and.arrow.down（推荐）</h2>
        <p>推荐：macOS 通用的“存储到”字形，与“共享”同族，含义最直接</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
      <section class="cell cand-1">
        <h2>tray.and.arrow.down</h2>
        <p>存入托盘：更像“下载/收件”，与保存到本地文件的含义稍远</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
      <section class="cell cand-2">
        <h2>arrow.down.doc</h2>
        <p>下载为文档：强调生成文件，但字形较窄、与复制图标轮廓相近</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
      <section class="cell cand-3">
        <h2>photo.badge.arrow.down</h2>
        <p>图片加下载角标：强调“图片”，字形最宽，挤在小按钮里偏重</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
  </main>
  <script src="../_shared/capture-toolbar.js"></script>
  <script>
    for (const mount of document.querySelectorAll('[data-shared-block="capture-toolbar"]')) CaptureToolbar.render(mount);
  </script>
</body>
