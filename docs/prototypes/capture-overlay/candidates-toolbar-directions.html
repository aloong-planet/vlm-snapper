    floppy is Lucide's "save" (official paths, 1.8 stroke like the other prototype icons); the drives are the
    app's SF Symbols rendered by AppKit at 15 pt. All are used as masks. The recommended candidate is what the
    prototype pages show until chosen.
  -->

    body { margin: 0; }
    .candidates { min-width: 1460px; min-height: 100vh; padding: 28px; color: #20242a; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; }
    .candidates h1 { margin: 0 0 18px; font-size: 18px; }
    .cell { margin-bottom: 18px; padding: 14px 16px; border: 1px solid #d9dde3; border-radius: 10px; background: #ffffff; }
    .cell h2 { margin: 0 0 4px; font-size: 13px; font-family: "SF Mono", Menlo, monospace; }
    .cell p { margin: 0 0 10px; color: #646c77; }
    .pair { display: grid; grid-template-columns: 680px 680px; gap: 12px; }
    .column { position: relative; height: 64px; padding: 14px; border-radius: 8px; color: var(--text); background: linear-gradient(150deg, var(--desktop-a), var(--desktop-b)); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; }

<body>
  <main class="candidates">
    <h1>保存按钮图标候选：磁盘（复制、关闭为现有图标）</h1>
      <section class="cell cand-0">
        <h2>floppy disk (Lucide save)（推荐）</h2>
        <p>推荐：通用的“磁盘即保存”字形；SF Symbols 没有软盘，需在图标模块中以自绘矢量作为明确例外</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
      <section class="cell cand-1">
        <h2>externaldrive</h2>
        <p>外置硬盘：SF Symbols 原生字形，像磁盘但更像“驱动器/存储设备”</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
      <section class="cell cand-2">
        <h2>internaldrive</h2>
        <p>内置硬盘：SF Symbols 原生字形，与外置硬盘相近，略扁</p>
        <div class="pair">
          <div class="column" data-theme="light"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
          <div class="column" data-theme="dark"><div class="capture-toolbar" data-shared-block="capture-toolbar"></div></div>
        </div>
      </section>
  </main>
  <script src="../_shared/capture-toolbar.js"></script>
  <script>
    for (const mount of document.querySelectorAll('[data-shared-block="capture-toolbar"]')) CaptureToolbar.render(mount);
  </script>
</body>
</html>
