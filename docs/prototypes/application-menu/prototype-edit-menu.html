<!doctype html>
<html lang="zh-Hans" data-theme="light" data-language="zh-Hans" data-focus-state="empty-key">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VLMSnapper · Edit menu</title>
  <!-- Demo harness: focus-state, language, and appearance controls are not product UI. -->
  <style>
    :root {
      color-scheme: light;
      --desktop: #e9ecf2;
      --window: rgba(250, 250, 252, .96);
      --surface: #ffffff;
      --surface-muted: #f0f2f6;
      --line: rgba(31, 35, 43, .16);
      --text: #20242c;
      --secondary: #687080;
      --tertiary: #8a92a1;
      --accent: #2671e8;
      --accent-soft: #dce9ff;
      --on-accent: #ffffff;
      --menu-shadow: rgba(31, 35, 43, .28);
      --harness: rgba(24, 27, 33, .94);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --desktop: #1f232a;
      --window: rgba(39, 42, 49, .97);
      --surface: #30343c;
      --surface-muted: #292d34;
      --line: rgba(255, 255, 255, .16);
      --text: #f2f4f7;
      --secondary: #b3bac6;
      --tertiary: #8f97a4;
      --accent: #4d8ff7;
      --accent-soft: #203d6d;
      --on-accent: #ffffff;
      --menu-shadow: rgba(0, 0, 0, .56);
      --harness: rgba(9, 10, 13, .96);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 980px;
      min-height: 760px;
      overflow: hidden;
      color: var(--text);
      background: var(--desktop);
      font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    button, input { font: inherit; }
    .menu-bar {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      background: var(--window);
      box-shadow: 0 1px 8px rgba(0, 0, 0, .08);
    }
    .menu-title {
      height: 24px;
      padding: 0 9px;
      border: 0;
      border-radius: 5px;
      color: var(--text);
      background: transparent;
    }
    .menu-title.app { font-weight: 650; }
    .menu-title.active { color: var(--on-accent); background: var(--accent); }
    .scene {
      position: relative;
      height: calc(100vh - 30px);
      display: grid;
      place-items: center;
      padding: 44px 60px 94px;
    }
    .window {
      width: min(860px, calc(100vw - 120px));
      height: 560px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--window);
      box-shadow: 0 24px 70px rgba(22, 26, 34, .24);
    }
    .titlebar {
      height: 46px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
    }
    .traffic { display: flex; gap: 7px; }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
    .provider-layout { height: calc(100% - 46px); display: grid; grid-template-columns: 210px 1fr; }
    .providers { padding: 24px 18px; border-right: 1px solid var(--line); background: var(--surface-muted); }
    .section-label { color: var(--tertiary); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .provider-row { margin-top: 14px; padding: 14px; border-radius: 8px; background: var(--accent-soft); font-weight: 650; }
    .provider-detail { padding: 38px 44px; }
    .provider-detail h1 { margin: 0; font-size: 24px; }
    .provider-detail > p { margin: 6px 0 24px; color: var(--secondary); }
    .provider-card { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .card-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .card-heading strong { font-size: 17px; }
    .card-state { color: #2fa85b; font-weight: 650; }
    .field-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .field-label { font-weight: 650; }
    .credential-state { color: #2fa85b; font-weight: 650; }
    .field-shell { position: relative; }
    .api-field {
      width: 100%;
      height: 38px;
      padding: 0 70px 0 12px;
      border: 2px solid var(--accent);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface);
      outline: 3px solid color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .field-actions { position: absolute; inset: 0 8px 0 auto; display: flex; align-items: center; gap: 8px; color: var(--secondary); }
    .field-action { width: 22px; padding: 0; border: 0; color: inherit; background: transparent; font-size: 18px; }
    .context-note { margin-top: 18px; color: var(--secondary); line-height: 1.55; }
    .edit-menu {
      position: absolute;
      top: 1px;
      left: 106px;
      width: 286px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--window);
      box-shadow: 0 18px 45px var(--menu-shadow);
      backdrop-filter: blur(30px);
      z-index: 5;
    }
    .menu-item {
      width: 100%;
      height: 25px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 12px;
      align-items: center;
      padding: 0 8px;
      border: 0;
      border-radius: 5px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }
    .menu-item:not(:disabled):hover,
    .menu-item:not(:disabled):focus-visible { color: var(--on-accent); background: var(--accent); outline: 0; }
    .menu-item:disabled { color: var(--tertiary); opacity: .58; }
    .shortcut { padding-left: 18px; font-variant-numeric: tabular-nums; }
    .submenu-mark { text-align: right; font-size: 10px; }
    .separator { height: 1px; margin: 4px 7px; background: var(--line); }
    .submenu {
      position: absolute;
      top: 290px;
      left: 396px;
      width: 300px;
      display: none;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--window);
      box-shadow: 0 18px 45px var(--menu-shadow);
      backdrop-filter: blur(30px);
      z-index: 6;
    }
    .submenu.visible { display: block; }
    .feedback {
      position: absolute;
      right: 22px;
      bottom: 22px;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--secondary);
      background: var(--window);
      opacity: 0;
      transition: opacity .16s ease;
    }
    .feedback.visible { opacity: 1; }
    .harness {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 16px;
      width: max-content;
      max-width: calc(100vw - 32px);
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      color: #f5f6f8;
      background: var(--harness);
      box-shadow: 0 10px 30px rgba(0,0,0,.24);
      z-index: 10;
    }
    .harness-label { padding: 0 5px; color: #aeb5c0; font-size: 11px; }
    .harness button {
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      color: #dfe3e9;
      background: transparent;
    }
    .harness button[aria-pressed="true"] { color: #fff; background: #3c4655; }
    .harness-divider { width: 1px; height: 18px; margin: 0 3px; background: rgba(255,255,255,.18); }
  </style>
</head>
<body>
  <header class="menu-bar" aria-label="macOS menu bar mock">
    <button class="menu-title app">VLMSnapper</button>
    <button class="menu-title" data-i18n="file">文件</button>
    <button class="menu-title active" data-i18n="edit">编辑</button>
    <button class="menu-title" data-i18n="window">窗口</button>
    <button class="menu-title" data-i18n="help">帮助</button>
  </header>

  <main class="scene">
    <article class="window" aria-label="Settings Center Provider context">
      <header class="titlebar"><div class="traffic"><span></span><span></span><span></span></div><strong>VLMSnapper</strong><div></div></header>
      <div class="provider-layout">
        <aside class="providers"><div class="section-label">SETTINGS</div><div class="provider-row">Provider</div></aside>
        <section class="provider-detail">
          <h1 data-i18n="providerTitle">Provider</h1>
          <p data-i18n="providerSubtitle">选择 Provider，然后在当前页面完成连接与模型选择。</p>
          <div class="provider-card">
            <div class="card-heading"><strong>DeepSeek</strong><span class="card-state" data-i18n="available">可用</span></div>
            <div class="field-heading"><label class="field-label" for="api-key">API Key</label><span class="credential-state" data-i18n="configured">● 已配置</span></div>
            <div class="field-shell">
              <input class="api-field" id="api-key" type="password" value="" placeholder="API Key" autofocus>
              <div class="field-actions" aria-hidden="true"><button class="field-action" tabindex="-1">×</button><button class="field-action" tabindex="-1">◉</button></div>
            </div>
            <div class="context-note" data-i18n="contextNote">Edit 菜单通过当前焦点自动决定可用项。此状态模拟设置中心内联 API Key 输入框，剪贴板中已有文字。</div>
          </div>
        </section>
      </div>
    </article>

    <nav class="edit-menu" aria-label="Edit menu">
      <button class="menu-item state-undo" disabled><span data-i18n="undo">撤销</span><span class="shortcut">⌘Z</span><span></span></button>
      <button class="menu-item state-redo" disabled><span data-i18n="redo">重做</span><span class="shortcut">⇧⌘Z</span><span></span></button>
      <div class="separator"></div>
      <button class="menu-item state-selection" disabled><span data-i18n="cut">剪切</span><span class="shortcut">⌘X</span><span></span></button>
      <button class="menu-item state-selection" disabled><span data-i18n="copy">拷贝</span><span class="shortcut">⌘C</span><span></span></button>
      <button class="menu-item" data-action="paste"><span data-i18n="paste">粘贴</span><span class="shortcut">⌘V</span><span></span></button>
      <button class="menu-item" data-action="paste-style"><span data-i18n="pasteStyle">粘贴并匹配样式</span><span class="shortcut">⌥⇧⌘V</span><span></span></button>
      <button class="menu-item state-selection" disabled><span data-i18n="delete">删除</span><span></span><span></span></button>
      <button class="menu-item" data-action="select-all"><span data-i18n="selectAll">全选</span><span class="shortcut">⌘A</span><span></span></button>
      <div class="separator"></div>
      <button class="menu-item state-rich" data-submenu="find" disabled><span data-i18n="find">查找</span><span></span><span class="submenu-mark">▶</span></button>
      <button class="menu-item state-rich" data-submenu="spelling" disabled><span data-i18n="spelling">拼写与语法</span><span></span><span class="submenu-mark">▶</span></button>
      <button class="menu-item state-rich" data-submenu="substitutions" disabled><span data-i18n="substitutions">替换</span><span></span><span class="submenu-mark">▶</span></button>
      <button class="menu-item state-rich" data-submenu="transformations" disabled><span data-i18n="transformations">转换</span><span></span><span class="submenu-mark">▶</span></button>
      <button class="menu-item state-rich" data-submenu="speech" disabled><span data-i18n="speech">语音</span><span></span><span class="submenu-mark">▶</span></button>
      <div class="separator"></div>
      <button class="menu-item" data-action="dictation"><span data-i18n="dictation">开始听写…</span><span></span><span></span></button>
      <button class="menu-item" data-action="emoji"><span data-i18n="emoji">表情与符号</span><span class="shortcut">⌃⌘Space</span><span></span></button>
    </nav>
    <div class="submenu" aria-label="Edit submenu"></div>
    <div class="feedback" aria-live="polite"></div>
  </main>

  <div class="harness" data-demo-harness aria-label="Demo controls, not product UI">
    <span class="harness-label">演示·焦点</span>
    <button data-focus="empty-key" aria-pressed="true">空 API Key</button>
    <button data-focus="selected-key" aria-pressed="false">已选择文字</button>
    <button data-focus="result-text" aria-pressed="false">结果正文</button>
    <span class="harness-divider"></span>
    <span class="harness-label">演示·语言</span>
    <button data-language="zh-Hans" aria-pressed="true">简体中文</button>
    <button data-language="en" aria-pressed="false">English</button>
    <span class="harness-divider"></span>
    <button id="theme-control">切换深浅色</button>
  </div>

  <script>
    const copy = {
      "zh-Hans": {
        file: "文件", edit: "编辑", window: "窗口", help: "帮助",
        providerTitle: "Provider", providerSubtitle: "选择 Provider，然后在当前页面完成连接与模型选择。",
        available: "可用", configured: "● 已配置",
        contextNote: "Edit 菜单通过当前焦点自动决定可用项。此状态模拟设置中心内联 API Key 输入框，剪贴板中已有文字。",
        undo: "撤销", redo: "重做", cut: "剪切", copy: "拷贝", paste: "粘贴",
        pasteStyle: "粘贴并匹配样式", delete: "删除", selectAll: "全选", find: "查找",
        spelling: "拼写与语法", substitutions: "替换", transformations: "转换", speech: "语音",
        dictation: "开始听写…", emoji: "表情与符号", action: "已触发：",
        submenu: {
          find: [["查找…", "⌘F"], ["查找下一个", "⌘G"], ["查找上一个", "⇧⌘G"], ["使用所选内容查找", "⌘E"], ["跳到所选内容", "⌘J"]],
          spelling: [["显示拼写与语法", "⌘:"], ["立即检查文稿", "⌘;"], ["键入时检查拼写", ""], ["随拼写检查语法", ""], ["自动纠正拼写", ""]],
          substitutions: [["显示替换", ""], ["智能拷贝/粘贴", ""], ["智能引号", ""], ["智能破折号", ""], ["智能链接", ""], ["数据检测器", ""], ["文本替换", ""]],
          transformations: [["全部大写", ""], ["全部小写", ""], ["首字母大写", ""]],
          speech: [["开始朗读", ""], ["停止朗读", ""]]
        }
      },
      en: {
        file: "File", edit: "Edit", window: "Window", help: "Help",
        providerTitle: "Provider", providerSubtitle: "Choose a Provider, then connect and select a model on this page.",
        available: "Available", configured: "● Configured",
        contextNote: "The Edit menu derives availability from the focused responder. This state simulates the inline API key field in Settings Center with text on the clipboard.",
        undo: "Undo", redo: "Redo", cut: "Cut", copy: "Copy", paste: "Paste",
        pasteStyle: "Paste and Match Style", delete: "Delete", selectAll: "Select All", find: "Find",
        spelling: "Spelling and Grammar", substitutions: "Substitutions", transformations: "Transformations", speech: "Speech",
        dictation: "Start Dictation…", emoji: "Emoji & Symbols", action: "Action: ",
        submenu: {
          find: [["Find…", "⌘F"], ["Find Next", "⌘G"], ["Find Previous", "⇧⌘G"], ["Use Selection for Find", "⌘E"], ["Jump to Selection", "⌘J"]],
          spelling: [["Show Spelling and Grammar", "⌘:"], ["Check Document Now", "⌘;"], ["Check Spelling While Typing", ""], ["Check Grammar With Spelling", ""], ["Correct Spelling Automatically", ""]],
          substitutions: [["Show Substitutions", ""], ["Smart Copy/Paste", ""], ["Smart Quotes", ""], ["Smart Dashes", ""], ["Smart Links", ""], ["Data Detectors", ""], ["Text Replacement", ""]],
          transformations: [["Make Upper Case", ""], ["Make Lower Case", ""], ["Capitalize", ""]],
          speech: [["Start Speaking", ""], ["Stop Speaking", ""]]
        }
      }
    };

    const field = document.querySelector("#api-key");
    const feedback = document.querySelector(".feedback");
    const submenu = document.querySelector(".submenu");

    function setLanguage(language) {
      document.documentElement.dataset.language = language;
      document.documentElement.lang = language;
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = copy[language][element.dataset.i18n];
      });
      document.querySelectorAll("[data-language]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.language === language));
      });
      submenu.classList.remove("visible");
    }

    function setFocusState(state) {
      document.documentElement.dataset.focusState = state;
      const hasSelection = state === "selected-key" || state === "result-text";
      const hasUndo = state !== "empty-key";
      const richText = state === "result-text";
      document.querySelectorAll(".state-selection").forEach((item) => { item.disabled = !hasSelection; });
      document.querySelector(".state-undo").disabled = !hasUndo;
      document.querySelector(".state-redo").disabled = true;
      document.querySelectorAll(".state-rich").forEach((item) => { item.disabled = !richText; });
      field.value = state === "empty-key" ? "" : "sk-example-selected";
      if (hasSelection) field.select(); else field.focus();
      document.querySelectorAll("[data-focus]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.focus === state));
      });
      submenu.classList.remove("visible");
    }

    function showSubmenu(kind, anchor) {
      if (anchor.disabled) return;
      const language = document.documentElement.dataset.language;
      submenu.replaceChildren(...copy[language].submenu[kind].map(([title, shortcut]) => {
        const item = document.createElement("button");
        item.className = "menu-item";
        item.innerHTML = `<span>${title}</span><span class="shortcut">${shortcut}</span><span></span>`;
        return item;
      }));
      submenu.style.top = `${anchor.offsetTop + 30}px`;
      submenu.classList.add("visible");
    }

    document.querySelectorAll("[data-focus]").forEach((button) => {
      button.addEventListener("click", () => setFocusState(button.dataset.focus));
    });
    document.querySelectorAll("[data-language]").forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.language));
    });
    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        const language = document.documentElement.dataset.language;
        feedback.textContent = copy[language].action + button.querySelector("[data-i18n]").textContent;
        feedback.classList.add("visible");
        window.setTimeout(() => feedback.classList.remove("visible"), 900);
      });
    });
    document.querySelectorAll("[data-submenu]").forEach((button) => {
      button.addEventListener("mouseenter", () => showSubmenu(button.dataset.submenu, button));
      button.addEventListener("focus", () => showSubmenu(button.dataset.submenu, button));
    });
    document.querySelector(".edit-menu").addEventListener("mouseleave", (event) => {
      if (!submenu.contains(event.relatedTarget)) submenu.classList.remove("visible");
    });
    submenu.addEventListener("mouseleave", () => submenu.classList.remove("visible"));
    document.querySelector("#theme-control").addEventListener("click", () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    });

    setLanguage("zh-Hans");
    setFocusState("empty-key");
  </script>
</body>
</html>
