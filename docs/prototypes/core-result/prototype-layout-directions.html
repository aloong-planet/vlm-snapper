  </template>

  <script>
    const body = document.body;
    const mockImageMarkup = document.querySelector('#mock-image-template').innerHTML;
    const resultMarkup = document.querySelector('#result-template').innerHTML;

    document.querySelectorAll('[data-mock-image]').forEach((node) => { node.innerHTML = mockImageMarkup; });
    document.querySelectorAll('[data-result-content]').forEach((node) => { node.innerHTML = resultMarkup; });

    const footerLabels = {
      complete: '翻译完成',
      streaming: '正在流式返回',
      error: '请求失败 · 等待手动重试'
    };

    function setState(state) {
      body.dataset.state = state;
      document.querySelectorAll('[data-footer-status]').forEach((node) => { node.textContent = footerLabels[state]; });
    }

    function setOperation(operation) {
      body.dataset.operation = operation;
      document.querySelectorAll('[data-operation-button]').forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.operationButton === operation);
      });
      document.querySelector('[data-output-title]').textContent = operation === 'extract' ? '提取结果' : '翻译结果';
      document.querySelector('[data-copy-label]').textContent = operation === 'extract' ? '复制' : '复制全部';
    }

    document.querySelectorAll('[data-operation-button]').forEach((button) => {
      button.addEventListener('click', () => setOperation(button.dataset.operationButton));
    });

    document.querySelector('#state-control').addEventListener('change', (event) => setState(event.target.value));
    document.querySelector('#theme-control').addEventListener('click', () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    });

    setState('complete');
    setOperation('translate');
  </script>
</body>
</html>
