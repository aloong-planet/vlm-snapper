name: Formal release verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: true
      buildVersion:
        description: Monotonic build version
        required: true
      appcastBaseURL:
        description: Public HTTPS appcast directory
        required: true
      downloadBaseURL:
        description: Public HTTPS DMG directory
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify live Provider contracts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VLMSNAPPER_OPENAI_MODEL: ${{ vars.VLMSNAPPER_OPENAI_MODEL }}
          VLMSNAPPER_GEMINI_MODEL: ${{ vars.VLMSNAPPER_GEMINI_MODEL }}
          VLMSNAPPER_DEEPSEEK_MODEL: ${{ vars.VLMSNAPPER_DEEPSEEK_MODEL }}
        run: |
          swift run VLMSnapperLiveProviderGate \
            --output "$RUNNER_TEMP/live-provider-contracts.json"
      - name: Upload live Provider contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VLMSnapper-${{ inputs.version }}-live-provider-contracts
          path: ${{ runner.temp }}/live-provider-contracts.json
          if-no-files-found: warn
      - name: Require release secrets
        env:
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_BUILD_KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          for value in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY KEYCHAIN_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            test -n "${!value}"
          done
      - name: Install signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_BUILD_KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          /usr/bin/xcrun notarytool store-credentials vlmsnapper-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$RUNNER_TEMP/build.keychain-db"
      - name: Build and verify formal release
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: vlmsnapper-notary
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-private-key
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          Scripts/release-macos.sh \
            "${{ inputs.version }}" \
            "${{ inputs.buildVersion }}" \
            "${{ inputs.appcastBaseURL }}" \
            "${{ inputs.downloadBaseURL }}" \
            "$SPARKLE_PUBLIC_KEY" \
            "$RUNNER_TEMP/formal-release"
      - uses: actions/upload-artifact@v4
        with:
          name: VLMSnapper-${{ inputs.version }}-verified
          path: ${{ runner.temp }}/formal-release
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/sparkle-private-key"
