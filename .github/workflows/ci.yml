name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Report toolchain
        run: /usr/bin/xcrun swift --version
      - name: Feature checklist ownership gate
        run: |
          python3 -m unittest discover -s Scripts/tests -p 'test_feature_checklist.py' -v
          python3 Scripts/verify-feature-checklist.py docs/.workings/v1-core/checklist.md
      - name: Test completion gate regression
        run: python3 -m unittest discover -s Scripts/tests -p 'test_swift_testing_log.py' -v
      - name: Accessibility report gate regression (no desktop required)
        run: python3 -m unittest discover -s Scripts/tests -p 'test_provider_accessibility.py' -v
      - name: Strict build
        run: >-
          /usr/bin/xcrun swift build
          -Xswiftc -warnings-as-errors
          -Xcc -Wall -Xcc -Wextra -Xcc -Werror
      - name: Full test suite
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test --skip ProviderApplicationTests 2>&1 | tee "$RUNNER_TEMP/non-app-tests.log"
          python3 Scripts/verify-swift-testing-log.py "$RUNNER_TEMP/non-app-tests.log"
          /usr/bin/xcrun swift test --filter ProviderApplicationTests --skip ProviderApplicationTestsNativeMenu 2>&1 | tee "$RUNNER_TEMP/app-tests.log"
          python3 Scripts/verify-swift-testing-log.py "$RUNNER_TEMP/app-tests.log"
      - name: Native Provider main-menu Paste (isolated process)
        timeout-minutes: 2
        run: |
          set -o pipefail
          /usr/bin/xcrun swift test --filter ProviderApplicationTestsNativeMenu.testNativeMainMenuPasteValidatesThroughRealKeyWindow | tee "$RUNNER_TEMP/provider-paste.log"
          grep -F 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/provider-paste.log"
      - name: Native Provider closed-window completion (isolated process)
        timeout-minutes: 2
        run: |
          set -o pipefail
          /usr/bin/xcrun swift test --filter ProviderApplicationTestsNativeMenu.testValidationCompletesWhileManagementRemainsClosed | tee "$RUNNER_TEMP/provider-closed.log"
          grep -F 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/provider-closed.log"
      - name: Release script syntax
        run: bash -n Scripts/*.sh
      - name: Release version contracts
        run: python3 -m unittest discover -s Scripts/tests -p 'test_release_version.py' -v
      - name: Three-architecture development packages
        env:
          VERSION: 0.0.0
          APPCAST_BASE_URL: https://ci.invalid/vlmsnapper
          SPARKLE_PUBLIC_ED_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OUTPUT_ROOT: ${{ runner.temp }}/vlmsnapper-development-dmgs
        run: Scripts/build-development-dmgs.sh
